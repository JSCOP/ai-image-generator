[package]
name = "studio"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Image Studio desktop app"

[lib]
# The _lib suffix avoids the Windows bin/lib output name clash (cargo#8519).
name = "studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
tauri = { version = "2.12.4", features = ["protocol-asset"] }
tauri-plugin-dialog = "2.8.3"
tauri-plugin-opener = "2.7.2"
image-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
dirs = "6"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
tokio = { workspace = true }
tokio-util = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
tauri = { version = "2.12.4", features = ["protocol-asset", "test"] }
test-fixture = { workspace = true }
tempfile = { workspace = true }
