[package]
name = "studio"
version = "0.1.6"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Image Studio desktop app"

[lib]
# The _lib suffix avoids the Windows bin/lib output name clash (cargo#8519).
name = "studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
tauri = { version = "2.12.4", features = ["protocol-asset"] }
tauri-plugin-dialog = "2.8.3"
tauri-plugin-opener = "2.7.2"
image-core = { workspace = true }
image = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
dirs = "6"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
tokio = { workspace = true, features = ["net", "io-util"] }
tokio-util = { workspace = true }
uuid = { workspace = true }
base64 = { workspace = true }
sha2 = { workspace = true }
reqwest = { workspace = true }
url = "2"
percent-encoding = "2"
# Background removal on the CPU; ONNX Runtime is linked statically (no DLL to ship).
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "download-binaries", "tls-rustls", "api-22"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Storage_FileSystem"] }

[dev-dependencies]
tauri = { version = "2.12.4", features = ["protocol-asset", "test"] }
test-fixture = { workspace = true }
tempfile = { workspace = true }
