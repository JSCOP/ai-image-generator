[workspace]
resolver = "2"
members = ["crates/image-core", "crates/image-cli", "crates/test-fixture", "apps/studio/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[workspace.dependencies]
image-core = { path = "crates/image-core" }
test-fixture = { path = "crates/test-fixture" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "signal", "fs"] }
tokio-util = "0.7"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
rand = "0.8"
regex = "1"
thiserror = "2"
tempfile = "3"
tiny_http = "0.12"
